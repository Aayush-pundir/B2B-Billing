services:
  - type: web
    name: b2b-billing
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # The Dockerfile installs only backend/requirements.txt (lightweight) —
    # PyMuPDF/easyocr are deliberately left out of this image (see
    # backend/requirements-ocr.txt) because they pull in torch/torchvision,
    # which blew past this plan's build memory/disk/time limit and was the
    # actual cause of repeated Blueprint failures. Scanned-PDF/image
    # extraction returns a clear message rather than being available here;
    # DOCX and digital-PDF extraction are unaffected.
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@example.local
      - key: ORG_NAME
        value: Your Company Pvt Ltd
      - key: ORG_STATE_CODE
        value: "09"
      - key: DEFAULT_GST_RATE
        value: "18.0"
      # Free-plan web services have an ephemeral filesystem — the SQLite
      # file and uploaded agreements are wiped on every deploy/restart.
      # Fine for a first look; for anything real, either:
      #   1. Add a persistent Disk (paid instance type) mounted at /app/data, or
      #   2. Point DATABASE_URL at a Render Postgres instance instead.
      - key: DATABASE_URL
        value: sqlite:////app/data/billing.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
